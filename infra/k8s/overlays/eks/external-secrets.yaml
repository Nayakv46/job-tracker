# `api-secrets` (DATABASE_URL, JWT_SECRET, REFRESH_SECRET) comes from the Secrets
# Manager secret created by Terraform. The SecretStore has no `auth` block, so the
# operator uses its own Pod Identity role, which can read only that secret.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: api-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: job-tracker-dev/api
