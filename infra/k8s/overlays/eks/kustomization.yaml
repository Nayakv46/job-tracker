apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# EKS (infra/terraform/envs/dev). Terraform creates the namespace, the AWS Load
# Balancer Controller, the External Secrets Operator and the database (RDS).
namespace: job-tracker

resources:
  - ../../base
  - external-secrets.yaml

# Set by the deploy step:
#   kustomize edit set image \
#     job-tracker-api=$REGISTRY/job-tracker/api:$TAG \
#     job-tracker-api-migrate=$REGISTRY/job-tracker/api-migrate:$TAG \
#     job-tracker-web=$REGISTRY/job-tracker/web:$TAG
images:
  - name: job-tracker-api
    newName: ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/job-tracker/api
    newTag: GIT_SHA
  - name: job-tracker-api-migrate
    newName: ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/job-tracker/api-migrate
    newTag: GIT_SHA
  - name: job-tracker-web
    newName: ACCOUNT_ID.dkr.ecr.eu-central-1.amazonaws.com/job-tracker/web
    newTag: GIT_SHA

patches:
  # Internet-facing ALB that sends traffic straight to the web pods (target-type ip).
  # The ALB appends the client IP to X-Forwarded-For, which the web app passes on to
  # the API, so TRUST_PROXY=1 from the base still picks the real client.
  - target:
      kind: Ingress
      name: job-tracker
    patch: |-
      - op: add
        path: /spec/ingressClassName
        value: alb
      - op: add
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /login
