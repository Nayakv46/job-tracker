# kind create cluster --config infra/k8s/kind/cluster.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: job-tracker
nodes:
  - role: control-plane
    # ingress-nginx's kind manifest schedules the controller on nodes with this label
    labels:
      ingress-ready: "true"
    # The ingress controller's port 80 is reachable on http://localhost:8080
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
