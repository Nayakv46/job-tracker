# Only the web app is public. It serves the pages and proxies GraphQL to the API through
# /api/graphql, so the API itself doesn't need an external route.
# The ingress class (and controller-specific annotations) are set by the overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-tracker
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
